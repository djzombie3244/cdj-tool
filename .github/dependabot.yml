version: 2
# The app bundles pinned Python 3.9 packages (see tools/build_installer.sh), so Python dependency bumps
# are not proposed automatically. Only GitHub Actions versions are kept up to date.
# setup-python 7 has no Python 3.9 on the CI runner, so its major versions are ignored.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "actions/setup-python"
        update-types: ["version-update:semver-major"]
